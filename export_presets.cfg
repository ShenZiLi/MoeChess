; 萌象棋 MoeChess — 6 平台导出配置（Godot 4.x）
; 关联：docs/development/acceptance-standard.md H1、docs/plans/2026-07-28-moechess-design.md §9.4
;
; 注意：本环境无 Godot 编辑器，未做真实导出验证。选项键名按 Godot 4.2 标准编写，
; 结构（[preset.N] + [preset.N.options]）符合 export_presets.cfg 语法；
; 未知/可选键 Godot 会以默认值兜底，不会导致加载失败。需在编辑器中复核最终选项。
;
; 6 平台：Windows / macOS / Linux / Android / iOS / Web（H1）
; 图标统一引用 res://assets/ui/icon.png（与 project.godot 一致；资源由美术管线补齐）。
; 移动端竖屏锁定：Android preset screen/orientation=1；iOS 由 project.godot
;   display/window/handheld/orientation=1 注入 Info.plist（H5）。
; Web 禁用线程：variant/thread_support=false（H6）。

