## GUT 4.x 配置文件（萌象棋 v1.0 测试入口）
## 关联：docs/development/test-cases.md、docs/development/acceptance-standard.md J1/J2
##
## 启动方式（项目根目录）：
##   godot -s addons/gut/gut_cmdln.gd -gconfig=.gut/gut_config.ini
## 或在 Godot 编辑器中通过 GUT 插件面板选择本配置运行。
##
## 测试目录：scripts/tests/，所有测试脚本 extends GutTest
[plugins]

enable=true

[gut]

# 测试脚本目录（覆盖 J1 单元测试 + J2 集成测试）
directory=res://scripts/tests

# 默认运行全部测试；可用 -gselect=test_xxx 过滤
include_subdirectories=true

# 日志/输出
log_level=3
# 1 = errors only, 2 = errors+warnings, 3 = errors+warnings+info
compact_mode=false

# 运行参数
pause_before_teardown=false
ignore_pause=false
exit_on_success=true
exit_on_failure=false

# 颜色输出
color_output=true

# 显示堆栈
show_stack_trace=true

[junit]

# JUnit XML 报告（CI 集成用）
junit_xml=false
junit_xml_path=res://.gut/junit.xml
